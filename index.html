    <script>
      // Captured as early as possible — before the app bundle even starts
      // downloading — so a fast `beforeinstallprompt` firing during that
      // window isn't lost to a React listener that hasn't mounted yet.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__pwaInstallEvent = e;
        window.dispatchEvent(new Event("pwa-install-ready"));
      });
    </script>
