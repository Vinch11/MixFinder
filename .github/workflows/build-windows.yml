name: Build MixFinder Windows

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "mixfinder-v5/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: mixfinder-v5
        run: npm install

      - name: Build MixFinder Windows installers
        working-directory: mixfinder-v5
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: MixFinder-Windows-Installers
          if-no-files-found: error
          path: |
            mixfinder-v5/src-tauri/target/release/bundle/msi/*.msi
            mixfinder-v5/src-tauri/target/release/bundle/nsis/*.exe
