name: Build MixFinder Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare MixFinder V5 source
        shell: pwsh
        run: |
          if (Test-Path "v5-build") { Remove-Item "v5-build" -Recurse -Force }
          New-Item -ItemType Directory -Path "v5-build" | Out-Null
          Expand-Archive -Path "MixFinder_V5_Source.zip" -DestinationPath "v5-build" -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: v5-build
        run: npm install

      - name: Build MixFinder Windows installers
        working-directory: v5-build
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: MixFinder-Windows-Installers
          if-no-files-found: error
          path: |
            v5-build/src-tauri/target/release/bundle/msi/*.msi
            v5-build/src-tauri/target/release/bundle/nsis/*.exe
